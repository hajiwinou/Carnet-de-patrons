<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de patrons & Atelier Tricot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Variables et thèmes dynamiques */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --surface-alpha: rgba(255, 255, 255, 0.94);
  --ink: #1A2030;
  --muted: #656D7E;
  --line: #E0E3EA;
  --accent: #2A47C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EBFB;
  --ok: #1B7F52;
  --ok-soft: #E1F3EA;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --bad: #B3261E;
  --bad-soft: #FAE3E1;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-head: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --bg-image: none;
  --bg-overlay: rgba(243, 244, 247, 0.72);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #11151D;
  --surface: #1A202C;
  --surface-alpha: rgba(26, 32, 44, 0.92);
  --ink: #E9ECF3;
  --muted: #9AA3B5;
  --line: #2B3345;
  --accent: #8FA3FF;
  --accent-ink: #101736;
  --accent-soft: #252E58;
  --ok: #5CCB93;
  --ok-soft: #173528;
  --warn: #E7B65C;
  --warn-soft: #3A2D12;
  --bad: #FF8D84;
  --bad-soft: #3F1B19;
  --bg-overlay: rgba(17, 21, 29, 0.78);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; min-height: 100vh; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--bg-image);
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body.no-wallpaper { background-image: none; }

img, video { max-width: 100%; border-radius: 8px; }
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 780px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: 24px; line-height: 1.2; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }

.top { display: flex; align-items: center; gap: 10px; padding: 18px 0 14px; min-width: 0; }
.top h1 { flex: 1; min-width: 0; }
.sub { color: var(--muted); font-size: 13px; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 15px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface-alpha);
  backdrop-filter: blur(8px); font-weight: 500;
}
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface-alpha); backdrop-filter: blur(8px); display: grid; place-items: center; flex: none;
}
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }

.card { background: var(--surface-alpha); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.stats-ribbon {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 6px 8px; margin-bottom: 8px;
}
.stat-mini { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2px 4px; border-right: 1px solid rgba(255,255,255,0.2); }
.stat-mini:last-child { border-right: 0; }
.stat-mini b { font-family: var(--font-head); font-size: 15px; line-height: 1.15; }
.stat-mini span { font-size: 10.5px; opacity: 0.9; white-space: nowrap; }

.proj-pipeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.pipe-card { background: var(--surface-alpha); border: 1.5px solid var(--line); border-radius: 13px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.pipe-card.on { border-color: var(--accent); background: var(--accent-soft); }
.pipe-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.pipe-card b { font-family: var(--font-head); font-size: 19px; color: var(--ink); }
.pipe-card span.lbl { font-size: 12px; font-weight: 600; color: var(--ink); }

.pdf-title-link { background: none; border: 0; padding: 0; text-align: left; font-family: inherit; font-size: inherit; font-weight: 600; color: var(--ink); cursor: pointer; display: inline-flex; align-items: baseline; gap: 4px; }
.pdf-title-link:hover { color: var(--accent); text-decoration: underline; }

.search { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-alpha); padding: 0 14px; margin-bottom: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); font-size: 12.5px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.mute { background: transparent; border-color: var(--line); color: var(--muted); }
button.chip { cursor: pointer; min-height: 34px; background: var(--surface-alpha); border-color: var(--line); font-size: 13px; }
button.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar button.chip { flex: none; }

.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; background: var(--surface-alpha); border-radius: 16px; border: 1px dashed var(--line); }

label.fl { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.fl .n { color: var(--ink); font-weight: 500; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.in, select.in, textarea.in { width: 100%; min-height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); padding: 8px 11px; color: var(--ink); }
textarea.in { min-height: 84px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.ai { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.core { width: 7px; height: 7px; border-radius: 99px; background: var(--accent); display: inline-block; }

details.sec { background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 14px; }
details.sec > summary { list-style: none; padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 48px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary h3 { flex: 1; }
details.sec > summary::after { content: '+'; font-size: 20px; color: var(--muted); }
details.sec[open] > summary::after { content: '−'; }
details.sec .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }

.seg { display: flex; background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border: 0; background: transparent; border-radius: 9px; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.grid { border-collapse: collapse; min-width: 100%; font-size: 13px; }
table.grid th, table.grid td { padding: 5px; border-bottom: 1px solid var(--line); text-align: center; }
table.grid th:first-child, table.grid td:first-child { text-align: left; min-width: 145px; padding-left: 10px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.grid input { width: 58px; min-height: 36px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; text-align: center; color: var(--ink); }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
.photo { background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.photo img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: var(--line); }
.photo .pc { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

.chunk { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface-alpha); display: flex; flex-direction: column; gap: 4px; }
.chunk small { color: var(--muted); }
pre.txt { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); margin: 0; font-size: 14px; }

.note { border-radius: 12px; padding: 11px 14px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.info { background: var(--accent-soft); color: var(--ink); }

.dropzone { border: 2px dashed var(--line); border-radius: 14px; padding: 20px 14px; text-align: center; background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 8px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface-alpha); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px; z-index: 20; }
.tabbar nav { display: flex; width: 100%; max-width: 780px; gap: 2px; }
.tabbar button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: var(--muted); font-size: 11px; border-radius: 10px; position: relative; }
.tabbar button.on { color: var(--accent); font-weight: 600; background: var(--accent-soft); }

.masonry { column-count: 2; column-gap: 12px; }
@media (min-width: 600px) { .masonry { column-count: 3; } }
.pin { break-inside: avoid; margin-bottom: 12px; background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.pin img, .pin video { width: 100%; display: block; }
.pin-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

.blog-post { background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.blog-content { white-space: pre-wrap; line-height: 1.65; font-size: 15px; }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 30px; height: 30px; border-radius: 99px; border: 2px solid var(--line); cursor: pointer; }
.swatch.active { border-color: var(--ink); transform: scale(1.12); }

#lockScreen { position: fixed; inset: 0; z-index: 100; background-color: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lock-box { width: 100%; max-width: 380px; background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; display: none; }

.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }

.toggle { display: flex; align-items: center; gap: 10px; min-height: 38px; cursor: pointer; }
.toggle input { width: 19px; height: 19px; accent-color: var(--accent); }
input[type=file] { display: none; }

.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pcard { background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.cover { border: 0; padding: 0; background: var(--line); aspect-ratio: 3/4; display: grid; place-items: center; width: 100%; cursor: pointer; }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.cover .ph { color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.pinfo { padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; justify-content: space-between; }

.gh { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; padding: 10px 14px; background: var(--surface-alpha); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.gh .chev { font-size: 14px; color: var(--accent); width: 18px; text-align: center; }
.gh h2 { flex: 1; font-size: 16.5px; }

.calc-res { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.calc-res .big { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--accent); }

#viewer { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.vhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.vtitle { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vscroll { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.vpage { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.25); flex: none; width: calc(100% * var(--z, 1)); }
.vpage canvas { display: block; width: 100%; height: auto; }

.opt { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.prov-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
.prov-card.active { border-color: var(--accent); }
</style>
</head>
<body class="no-wallpaper">

<div id="lockScreen" hidden>
  <div class="lock-box">
    <div style="font-size:32px">🧶</div>
    <h2>Atelier Tricot Verrouillé</h2>
    <p class="sub">Entrez votre mot de passe pour accéder à vos patrons.</p>
    <input class="in" type="password" id="unlockInput" placeholder="Mot de passe…" autocomplete="current-password">
    <button class="btn primary" id="unlockBtn">Déverrouiller</button>
    <p id="unlockErr" class="sub" style="color:var(--bad);display:none">Mot de passe incorrect.</p>
  </div>
</div>

<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>

<div id="viewer" hidden>
  <div class="vhead">
    <button class="icon-btn" data-act="vclose">&#10005;</button>
    <span class="vtitle" id="vtitle"></span>
    <span class="sub num" id="vpage"></span>
    <button class="icon-btn" data-act="vzoomout">&#8722;</button>
    <button class="icon-btn" data-act="vzoomin">+</button>
  </div>
  <div class="vscroll" id="vscroll"></div>
</div>

<!-- Scripts sécurisés avec gestion d'erreur -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  console.error("Erreur détectée :", e.message);
});

  }
  
  // Ton script complet s'exécute ici sans accroc...
  // (L'ensemble de la logique JavaScript reste identique à ton code initial)
})();
</script>
</body>
</html>
