function matCard(){var m=allMat(),h='<details data-o="m"'+op('m')+'><summary>Matériel utilisé<small>'+m.length+' éléments</small></summary><div class="in"><ul class="lst">';m.forEach(function(x){h+='<li><span class="dot"'+(x.col?' style="background:'+x.col+'"':'')+'></span><span><b>'+x.k+'</b> '+esc(x.n)+'</span></li>'});return h+'</ul></div></details>'}
function finPanel(){var f=S.fin,fc=finCount(f),n=fc[0],tot=fc[1],h='<div class="ml">';
 [['bloque','Pull bloqué'],['fils','Fils rentrés']].forEach(function(x){h+='<div><span class="lab">'+x[1]+'</span><div class="seg2" role="group" aria-label="'+x[1]+'"><button data-a="fin" data-v="'+x[0]+'" data-i="0" aria-pressed="'+!f[x[0]]+'">Pas encore</button><button data-a="fin" data-v="'+x[0]+'" data-i="1" aria-pressed="'+!!f[x[0]]+'">Oui</button></div></div>'});
 h+='<div><span class="lab">Boutons ou zip posés</span><div class="seg3" role="group" aria-label="Boutons ou zip posés">'+[['0','Pas encore'],['1','Oui'],['2','Sans objet']].map(function(o){return '<button data-a="fin" data-v="bz" data-i="'+o[0]+'" aria-pressed="'+((f.bz||0)===+o[0])+'">'+o[1]+'</button>'}).join('')+'</div></div>';
 h+=(n===tot?'<p class="ok">Prêt à porter.</p>':'<p class="hint">Il reste '+(tot-n)+' finition'+(tot-n>1?'s':'')+' avant de le porter.</p>')+'</div>';
 return h}
function suivi(){
 if(S.st==='wait')return prep();if(S.st==='done')return bilan()+photosCard();
 var d='',p=S.c[0],h=hero();
 h+='<details data-o="c"'+op('c')+'><summary>Compteurs<small>'+S.c.length+'</small></summary><div class="in">';
 h+='<div class="main"><button class="rd" data-a="dec" data-i="0" aria-label="Retirer un rang"'+d+'>−</button><div><output>'+p.v+'</output><small>rang sur '+S.total+'</small></div><button class="rp" data-a="inc" data-i="0" aria-label="Ajouter un rang"'+d+'>+</button></div>';
 S.c.slice(1).forEach(function(c,j){var i=j+1;h+='<div class="crow"><span>'+esc(c.n)+rem(c)+'</span><div class="step"><button data-a="dec" data-i="'+i+'" aria-label="Retirer 1 à '+esc(c.n)+'"'+d+'>−</button><output>'+c.v+(c.t?'<small>/'+c.t+'</small>':'')+'</output><button data-a="inc" data-i="'+i+'" aria-label="Ajouter 1 à '+esc(c.n)+'"'+d+'>+</button></div></div>'});
 h+='<div class="add"><input data-k="cn" placeholder="Nom du compteur" aria-label="Nom du compteur"></div><div class="add"><input data-k="ce" type="number" min="2" inputmode="numeric" placeholder="Rappel tous les N rangs" aria-label="Rappel tous les N rangs, facultatif"><button class="btn" data-a="addc">Ajouter</button></div></div></details>';
 return h+photosCard();h+='<details data-o="m"'+op('m')+'><summary>Matériel<small>'+allMat().length+' éléments</small></summary><div class="in"><ul class="lst">';
 allMat().forEach(function(m){h+='<li>'+(m.col?'<span class="dot" style="background:'+m.col+'"></span>':'<span class="dot"></span>')+'<span><b>'+m.k+'</b> '+esc(m.n)+'</span></li>'});
 h+='</ul><div class="add"><select data-k="mt" aria-label="Type"><option>Fil</option><option>Aiguilles</option><option>Marqueurs</option></select><input data-k="mn" placeholder="Détail" aria-label="Détail"><button class="btn" data-a="addm">Ajouter</button></div></div></details>';
 h+='<details data-o="t"'+op('t')+'><summary>Chrono<small>'+fmt(S.sec)+'</small></summary><div class="in"><div class="tm"><output id="tm">'+clock(S.sec)+'</output><button class="btn pri" data-a="run"'+d+'>'+(S.run?'Pause':'Démarrer')+'</button></div></div></details>';
 return h}
function journal(){
 var h='';
 h+='<details open><summary>Entrées<small>'+S.notes.length+'</small></summary><div class="in">';
 S.notes.forEach(function(n){h+='<div class="ent"><small>'+n.d+', rang '+n.r+'</small><div>'+esc(n.t)+'</div>'+(n.a&&n.a.length?'<div class="ma">'+n.a.map(attHtml).join('')+'</div>':'')+'</div>'});
 h+='</div></details>';
 if(false){h+='<details open><summary>Souvenir</summary><div class="in"><span>Ma note pour ce projet</span><div class="rate">';for(var i=1;i<=5;i++)h+='<button data-a="rate" data-v="'+i+'" aria-pressed="'+(S.rate===i)+'" aria-label="Note '+i+' sur 5">'+i+'</button>';h+='</div></div></details>'}
 return h}
function render(){if(S.view==='list'){document.getElementById('app').innerHTML=listView();return}if(S.view==='pdf'){document.getElementById('app').innerHTML=pdfView();return}
 var keep={};document.querySelectorAll('[data-k]').forEach(function(i){keep[i.dataset.k]=i.value});
 var p=S.c[0],pc=Math.round(p.v/S.total*100);
 var h='<div class="bar" style="--bar:'+BAR[S.st]+'"><button class="back" data-a="back">Projets</button><h1>'+esc(S.title)+'</h1><span class="chip">'+LAB[S.st]+'</span></div><div class="body">';
 var ph=patHtml();
 h+='<div class="seg" role="group" aria-label="Statut du projet">';
 [['wait','En attente'],['wip','En cours'],['done','Terminé']].forEach(function(s){h+='<button data-a="st" data-v="'+s[0]+'" aria-pressed="'+(S.st===s[0])+'">'+s[1]+'</button>'});
 h+='</div>';if(S.st!=='wait')h+='<div class="stats"><div><b>'+p.v+'/'+S.total+'</b><small>rangs</small></div>'+(S.st==='done'?'<button class="stb" data-a="ropen" aria-expanded="'+!!S.rop+'"><b>'+(S.rate?S.rate+' / 5':'Pas notée')+'</b><small>note du patron</small></button>':'<div><b>'+pc+' %</b><small>avancement</small></div>')+'<div><b>'+fmt(S.sec)+'</b><small>'+(S.st==='wip'?'reste ~'+rest():'temps')+'</small></div></div>';
 if(S.st==='wip')h+='<div class="prog" role="progressbar" aria-valuenow="'+pc+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pc+'%"></i></div>';
 if(S.st==='done'&&S.rop)h+=ratePanel();h+=ph;h+='<div class="tabs" role="tablist"><button role="tab" data-a="tab" data-v="suivi" aria-selected="'+(S.tab==='suivi')+'">'+({wait:'Préparation',wip:'Suivi',done:'Suivi'}[S.st])+'</button><button role="tab" data-a="tab" data-v="journal" aria-selected="'+(S.tab==='journal')+'">Notes</button></div>';
 h+=(S.tab==='suivi'?suivi():journal())+'</div>';
 document.getElementById('app').innerHTML=h;
 document.querySelectorAll('[data-k]').forEach(function(i){if(keep[i.dataset.k]!=null)i.value=keep[i.dataset.k]});var ps=document.querySelector('[data-k="ps"]');if(ps&&S.pfocus){ps.focus();S.pfocus=false}}
function val(k){var e=document.querySelector('[data-k="'+k+'"]');return e?e.value.trim():''}
document.addEventListener('toggle',function(e){var o=e.target.dataset&&e.target.dataset.o;if(o)S.open[o]=e.target.open},true);
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,i=+b.dataset.i,v=b.dataset.v;if(a==='needle'||a==='file'||a==='cover'||a==='natt'||a==='pfile')return;S.nflash=false;
 if(a==='st'){S.st=v;if(v==='done')S.c[0].v=S.total;if(v!=='wip'&&S.run){S.run=false;clearInterval(TIMER)}}
 else if(a==='tab')S.tab=v;
 else if(a==='inc'){S.c[i].v++;if(i===0)S.c.forEach(function(c,j){if(j&&c.ev&&S.c[0].v%c.ev===0&&(!c.t||c.v<c.t))c.v++})}
 else if(a==='dec'){if(i===0)S.c.forEach(function(c,j){if(j&&c.ev&&S.c[0].v%c.ev===0&&c.v>0)c.v--});S.c[i].v=Math.max(0,S.c[i].v-1)}
 else if(a==='addc'){var n=val('cn');if(!n)return;var ev=+val('ce');S.c.push({n:n,v:0,ev:ev>1?ev:0});var xe=document.querySelector('[data-k="ce"]');if(xe)xe.value='';var x=document.querySelector('[data-k="cn"]');x.value=''}
 
 else if(a==='note'){var t=val('nt');if(!t&&!S.att.length)return;S.notes.unshift({d:'21 nov.',r:S.c[0].v,t:t,a:S.att.slice()});S.att=[];S.nflash=true;document.querySelector('[data-k="nt"]').value=''}
 else if(a==='yadd')S.yarns.push({m:'',cw:'',c:'#efe6d6',cn:'Écru',pel:1,used:0,pal:false});
 else if(a==='ydel')S.yarns.splice(i,1);
 else if(a==='ypal')S.yarns[i].pal=!S.yarns[i].pal;
 else if(a==='ycol'){var cc=COLS[+v];S.yarns[i].c=cc[1];S.yarns[i].cn=cc[0];S.yarns[i].pal=false}
 else if(a==='yu')S.yarns[i].used=Math.max(0,S.yarns[i].used+(+v));
 else if(a==='size')S.prep.size=S.prep.size===v?'':v;
 else if(a==='ideas')S.ideas=!S.ideas;
 else if(a==='idea')S.prep.insp.push({n:v});
 else if(a==='rmi')S.prep.insp.splice(i,1);
 else if(a==='rate')S.rate=S.rate===+v?0:+v;
 else if(a==='fin')S.fin[v]=v==='bz'?i:i===1;
 else if(a==='tag')S.tags[v]=!S.tags[v];
 else if(a==='covrst')S.cover='';
 else if(a==='popen'){S.popen=!S.popen;S.pfocus=S.popen}
 else if(a==='ppick'){S.pat=i;S.popen=false;S.psearch=''}
 else if(a==='mat'){S.matOpen=!S.matOpen;S.finOpen=false}
 else if(a==='fin2'){S.finOpen=!S.finOpen;S.matOpen=false}
 else if(a==='flt')S.f=v;
 else if(a==='qinc'){PJ[i].rows=Math.min(PJ[i].total,PJ[i].rows+1)}
 else if(a==='qstart'){PJ[i].st='wip';PJ[i].rows=0;PJ[i].last='20 nov.';PJ.push(PJ.splice(i,1)[0]);S.f='wip';openP(PJ.length-1)}
 else if(a==='newp'){PJ.push({n:'Nouveau projet',pat:-1,st:'wait',info:'Rien de prêt pour l’instant',total:118,rows:0});S.f='wait'}
 else if(a==='open')openP(i);
 else if(a==='back')backP();
 else if(a==='rk')S.rk=!S.rk;
 else if(a==='mvu'||a==='mvd')mv(i,a==='mvu'?-1:1);
 else if(a==='pdf'){if(S.pat<0){S.popen=true;S.pfocus=true}else{S.view='pdf';S.pg=1}}
 else if(a==='pdfback')S.view='fiche';
 else if(a==='mk')S.markers=Math.max(0,S.markers+(+v));
 else if(a==='ropen'){S.rop=!S.rop;if(S.rop){S.rd=S.rate;S.td=Object.assign({},S.tags)}}
 else if(a==='rstar')S.rd=S.rd===+v?0:+v;
 else if(a==='rtag')S.td[v]=!S.td[v];
 else if(a==='rsave'){S.rate=S.rd;S.tags=Object.assign({},S.td);S.rop=false}
 else if(a==='arec'){if(S.rec)stopRec();else startRec()}
 else if(a==='adel')S.att.splice(i,1);
 else if(a==='pgp')S.pg=Math.max(1,S.pg-1);
 else if(a==='pgn')S.pg=Math.min(S.pn,S.pg+1);
 else if(a==='zm')S.zoom=Math.min(200,Math.max(50,S.zoom+(+v)));
 
 else if(a==='run')setRun(!S.run);
 render()});
document.addEventListener('input',function(e){var yd=e.target.dataset;if(yd.y!==undefined){var yy=S.yarns[+yd.y];if(yd.f==='pel'){yy.pel=Math.max(0,parseInt(e.target.value)||0);var bb=e.target.closest('.yc').querySelector('.ball b');if(bb)bb.textContent=yy.used+' / '+yy.pel}else yy[yd.f]=e.target.value}
if(e.target.dataset.k==='qs'){S.q=e.target.value;var pq=document.getElementById('plst');if(pq)pq.innerHTML=cardsHtml()}if(e.target.dataset.k==='memo')S.memo=e.target.value;if(e.target.dataset.k==='ps'){S.psearch=e.target.value;var pl=document.getElementById('plist');if(pl)pl.innerHTML=plistHtml()}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.a==='needle'){S.prep.needle=t.value;render()}else if(t.dataset.a==='cover'){var cf=t.files[0];if(!cf)return;var cr=new FileReader();cr.onload=function(){S.cover=cr.result;render()};cr.readAsDataURL(cf)}else if(t.dataset.a==='natt'||t.dataset.a==='pfile'){var kd=t.dataset.kind||'img',pf=t.dataset.a==='pfile';Array.prototype.forEach.call(t.files,function(f){var r2=new FileReader();r2.onload=function(){if(pf)S.photos.push({src:r2.result});else S.att.push({t:kd,src:r2.result,n:f.name});render()};r2.readAsDataURL(f)})}else if(t.dataset.a==='file'){Array.prototype.forEach.call(t.files,function(f){var r=new FileReader();r.onload=function(){S.prep.insp.push({src:r.result});render()};r.readAsDataURL(f)})}});
render();
</script>
