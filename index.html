<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de patrons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Variables et thèmes (Clair / Sombre automatique ou manuel) */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #1A2030;
  --muted: #656D7E;
  --line: #E0E3EA;
  --accent: #2A47C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EBFB;
  --ok: #1B7F52;
  --ok-soft: #E1F3EA;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --bad: #B3261E;
  --bad-soft: #FAE3E1;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151D;
    --surface: #1A202C;
    --ink: #E9ECF3;
    --muted: #9AA3B5;
    --line: #2B3345;
    --accent: #8FA3FF;
    --accent-ink: #101736;
    --accent-soft: #252E58;
    --ok: #5CCB93;
    --ok-soft: #173528;
    --warn: #E7B65C;
    --warn-soft: #3A2D12;
    --bad: #FF8D84;
    --bad-soft: #3F1B19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151D;
  --surface: #1A202C;
  --ink: #E9ECF3;
  --muted: #9AA3B5;
  --line: #2B3345;
  --accent: #8FA3FF;
  --accent-ink: #101736;
  --accent-soft: #252E58;
  --ok: #5CCB93;
  --ok-soft: #173528;
  --warn: #E7B65C;
  --warn-soft: #3A2D12;
  --bad: #FF8D84;
  --bad-soft: #3F1B19;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  transition: background-color 0.2s ease, color 0.2s ease;
}
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 24px; line-height: 1.15; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }

.top { display: flex; align-items: center; gap: 12px; padding: 18px 0 12px; min-width: 0; }
.top h1 { flex: 1; min-width: 0; }
.sub { color: var(--muted); font-size: 13px; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 500;
  transition: transform 0.1s ease, background-color 0.15s ease;
}
.btn:active:not([disabled]) { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.5; cursor: default; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  flex: none;
}
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-head); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }

.search { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; margin-bottom: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 0 10px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--ink);
  font-size: 12.5px;
  border: 1px solid transparent;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.mute { background: transparent; border-color: var(--line); color: var(--muted); }
button.chip { cursor: pointer; min-height: 34px; background: var(--surface); border-color: var(--line); font-size: 13px; padding: 0 12px; }
button.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 500; }

.filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar button.chip { flex: none; }

.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s ease; }

.empty { text-align: center; padding: 36px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty h2 { color: var(--ink); }

label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.fl .n { color: var(--ink); font-weight: 500; font-size: 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.in, select.in, textarea.in {
  width: 100%;
  min-height: 42px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  padding: 8px 10px;
  color: var(--ink);
}
textarea.in { min-height: 84px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.ai { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.core { width: 7px; height: 7px; border-radius: 99px; background: var(--accent); display: inline-block; }

details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.sec > summary { list-style: none; padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 48px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary h3 { flex: 1; }
details.sec > summary::after { content: '+'; font-size: 20px; color: var(--muted); }
details.sec[open] > summary::after { content: '−'; }
details.sec .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }

.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; overflow-x: auto; }
.seg button { flex: 1; min-height: 38px; border: 0; background: transparent; border-radius: 9px; font-size: 14px; white-space: nowrap; padding: 0 12px; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.grid { border-collapse: collapse; min-width: 100%; font-size: 13px; }
table.grid th, table.grid td { padding: 4px; border-bottom: 1px solid var(--line); text-align: center; }
table.grid th:first-child, table.grid td:first-child {
  text-align: left;
  min-width: 150px;
  padding-left: 10px;
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 1;
}
table.grid input { width: 58px; min-height: 36px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; text-align: center; padding: 0 4px; color: var(--ink); }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.photo { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.photo img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: var(--line); }
.photo .pc { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

.chunk { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.chunk small { color: var(--muted); }
pre.txt { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); margin: 0; font-size: 14px; }

.note { border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.info { background: var(--accent-soft); color: var(--ink); }

/* Zone glisser-déposer */
.dropzone {
  border: 2px dashed var(--line);
  border-radius: 12px;
  padding: 20px 14px;
  text-align: center;
  background: var(--bg);
  transition: border-color 0.15s ease, background-color 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.dropzone.dragover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: center;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  z-index: 20;
}
.tabbar nav { display: flex; width: 100%; max-width: 720px; }
.tabbar button {
  flex: 1;
  border: 0;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 52px;
  color: var(--muted);
  font-size: 11.5px;
  border-radius: 10px;
}
.tabbar button.on { color: var(--accent); font-weight: 600; }

#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 30;
  max-width: 90vw;
  display: none;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}

.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; display: inline-block; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.toggle { display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.guide li { margin: 4px 0; }
.guide ul { margin: 6px 0 0; padding-left: 18px; }
.num { font-variant-numeric: tabular-nums; }
input[type=file] { display: none; }

.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.cover { border: 0; padding: 0; background: var(--line); aspect-ratio: 3/4; display: grid; place-items: center; width: 100%; cursor: pointer; overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.cover .ph { color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.pinfo { padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; justify-content: space-between; }

.gh { display: flex; align-items: center; gap: 8px; margin: 20px 0 10px; flex-wrap: wrap; }
.gh h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }

#viewer { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.vhead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.vtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.vscroll {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px max(12px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-start;
}
.vpage { background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25); flex: none; width: calc(100% * var(--z, 1)); }
.vpage canvas { display: block; width: 100%; height: auto; }

.opt { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.opt .scroll-x { background: var(--surface); }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>

<!-- Visionneuse PDF plein écran -->
<div id="viewer" hidden>
  <div class="vhead">
    <button class="icon-btn" data-act="vclose" aria-label="Fermer">&#10005;</button>
    <span class="vtitle" id="vtitle"></span>
    <span class="sub num" id="vpage"></span>
    <button class="icon-btn" data-act="vzoomout" aria-label="Réduire">&#8722;</button>
    <button class="icon-btn" data-act="vzoomin" aria-label="Agrandir">+</button>
  </div>
  <div class="vscroll" id="vscroll"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function() {
  'use strict';

  /* Configuration du worker PDF.js */
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  /* ============ Stockage IndexedDB autonome pour PDF & Photos ============ */
  var IDB = {
    db: null,
    open: function() {
      var self = this;
      if (self.db) return Promise.resolve(self.db);
      return new Promise(function(resolve, reject) {
        if (!window.indexedDB) return reject(new Error('IndexedDB non supporté'));
        var req = indexedDB.open('carnet_patrons_db', 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('blobs')) {
            db.createObjectStore('blobs');
          }
        };
        req.onsuccess = function(e) {
          self.db = e.target.result;
          resolve(self.db);
        };
        req.onerror = function() {
          reject(req.error || new Error('Erreur IndexedDB'));
        };
      });
    },
    put: function(id, blob) {
      return this.open().then(function(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction('blobs', 'readwrite');
          tx.objectStore('blobs').put(blob, id);
          tx.oncomplete = function() { resolve(id); };
          tx.onerror = function() { reject(tx.error); };
        });
      });
    },
    get: function(id) {
      return this.open().then(function(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction('blobs', 'readonly');
          var req = tx.objectStore('blobs').get(id);
          req.onsuccess = function() { resolve(req.result || null); };
          req.onerror = function() { reject(req.error); };
        });
      });
    },
    del: function(id) {
      return this.open().then(function(db) {
        return new Promise(function(resolve) {
          var tx = db.transaction('blobs', 'readwrite');
          tx.objectStore('blobs').delete(id);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { resolve(); };
        });
      });
    }
  };

  /* Cache mémoire des Blobs et URLs objet */
  var blobs = new Map();
  var blobUrls = new Map();

  function getBlobUrl(id) {
    if (!id) return '';
    if (blobUrls.has(id)) return blobUrls.get(id);
    if (blobs.has(id)) {
      var u = URL.createObjectURL(blobs.get(id));
      blobUrls.set(id, u);
      return u;
    }
    return '';
  }

  async function saveBlob(id, blob) {
    blobs.set(id, blob);
    if (blobUrls.has(id)) {
      URL.revokeObjectURL(blobUrls.get(id));
      blobUrls.delete(id);
    }
    try {
      await IDB.put(id, blob);
    } catch (e) {
      console.warn('Stockage IndexedDB limité:', e);
    }
    return id;
  }

  async function loadBlob(id) {
    if (!id) return null;
    if (blobs.has(id)) return blobs.get(id);
    try {
      var b = await IDB.get(id);
      if (b) {
        blobs.set(id, b);
        return b;
      }
    } catch (e) {}
    return null;
  }

  function resolveLazyImages() {
    document.querySelectorAll('img[data-blob-id]').forEach(function(img) {
      var id = img.getAttribute('data-blob-id');
      if (!id) return;
      var cached = getBlobUrl(id);
      if (cached) {
        if (img.src !== cached) img.src = cached;
        img.removeAttribute('data-blob-id');
      } else {
        loadBlob(id).then(function(b) {
          if (b && document.body.contains(img)) {
            img.src = getBlobUrl(id);
            img.removeAttribute('data-blob-id');
          }
        });
      }
    });
  }

  /* ============ Schéma des données ============ */
  var SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL'];
  var KINDS = [['modele', 'Photo du patron'], ['fini', 'Résultat tricoté'], ['croquis', 'Croquis']];
  var MEASURES = [
    ['bust', 'Tour de poitrine fini'], ['waist', 'Tour de taille'], ['hip', 'Tour de hanches'],
    ['length', 'Longueur totale'], ['back_len', 'Longueur jusqu\'à l\'emmanchure'], ['armhole', 'Hauteur d\'emmanchure'],
    ['shoulder', 'Largeur d\'épaules'], ['neck_w', 'Largeur d\'encolure'], ['sleeve', 'Longueur de manche'],
    ['upper_arm', 'Tour de bras'], ['wrist', 'Tour de poignet'], ['hem_h', 'Hauteur des côtes du bas']
  ];
  var COUNTS = [
    ['caston', 'Montage du corps'], ['chest', 'Mailles au tour de poitrine'], ['waist', 'Mailles à la taille'],
    ['hip', 'Mailles aux hanches'], ['sl_caston', 'Montage des manches'], ['sl_max', 'Mailles de manche (max)'],
    ['neck', 'Mailles d\'encolure'], ['shoulder', 'Mailles par épaule'], ['rows_body', 'Rangs du corps'],
    ['rows_sleeve', 'Rangs de manche'], ['yarn_m', 'Métrage nécessaire (m)']
  ];
  var CORE_ROWS = { measures: ['bust', 'length', 'shoulder', 'sleeve'], counts: ['caston', 'chest'] };

  var GROUPDEF = {
    'Manches': { fields: ['sleeves', 'sleeve_shape', 'cuffs'], m: ['sleeve', 'upper_arm', 'wrist'], c: ['sl_caston', 'sl_max', 'rows_sleeve'] },
    'Encolure': { fields: ['neckline', 'neck_finish'], m: ['neck_w'], c: ['neck'] },
    'Bas et longueur': { fields: ['length', 'hem'], m: ['length', 'back_len', 'hem_h'], c: ['caston', 'hip', 'rows_body'] },
    'Fermeture': { fields: ['closure', 'buttons'], m: [], c: [] },
    'Poches': { fields: ['pockets'], m: [], c: [] },
    'Finitions': { fields: ['hem', 'cuffs', 'neck_finish', 'bind_off', 'blocking'], m: [], c: [] },
    'Autre': { fields: [], m: [], c: [] }
  };
  var GROUP_NAMES = Object.keys(GROUPDEF);

  var SCHEMA = [
    {
      id: 'ident', t: 'Identité du patron',
      why: 'Classe le patron et permet de filtrer les données par type de vêtement et de niveau.',
      f: [
        { k: 'designer', l: 'Créateur·rice', t: 'text' },
        { k: 'language', l: 'Langue du patron', t: 'select', o: ['Français', 'Anglais', 'Autre'], core: 1 },
        { k: 'garment', l: 'Type de vêtement', t: 'select', o: ['Pull', 'Cardigan', 'Gilet sans manches', 'Top / débardeur', 'Robe', 'Jupe', 'Bonnet', 'Écharpe / snood', 'Châle', 'Chaussettes', 'Mitaines / gants', 'Couverture', 'Sac', 'Autre'], core: 1 },

  function cleanText(raw, o) {
    var pages = String(raw || '').split('\f').map(function(s) {
      return s.split('\n').map(function(l) { return l.trim(); });
    });
    if (o.headers && pages.length >= 3) {
      var cnt = new Map(), key = function(l) { return l.replace(/\d+/g, '#').toLowerCase(); };
      pages.forEach(function(pg) {
        var ed = new Set(pg.slice(0, 2).concat(pg.slice(-2)).filter(Boolean).map(key));
        ed.forEach(function(k) { cnt.set(k, (cnt.get(k) || 0) + 1); });
      });
      var th = Math.max(2, Math.ceil(pages.length * 0.5));
      pages = pages.map(function(pg) {
        return pg.filter(function(l, i) {
          if (!l) return true;
          var edge = i < 2 || i >= pg.length - 2;
          return !(edge && cnt.get(key(l)) >= th && l.length < 90);
        });
      });
    }
    var t = pages.map(function(pg) { return pg.join('\n'); }).join('\n');
    t = t.normalize('NFC').replace(/[\u00AD]/g, '').replace(/ﬁ/g, 'fi').replace(/ﬂ/g, 'fl').replace(/\u00A0/g, ' ')
      .replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[•▪●◦]\s*/g, '- ')
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
    t = t.replace(/^\s*(?:page\s*)?\d{1,3}\s*(?:\/|sur|of)?\s*\d{0,3}\s*$/gim, '');
    t = t.replace(/([a-zà-ÿ])-\n([a-zà-ÿ])/g, '$1$2');
    t = t.replace(/([^\n.:;!?)\]])\n(?=[a-zàâçéèêëîïôûùüÿœ(])/g, '$1 ');
    t = t.replace(/(\d),(\d+)(\s*(?:mm|cm|m|g|kg|%))/g, '$1.$2$3')
      .replace(/(\d)\s*(?:millim[eè]tres?|mm)\b/gi, '$1 mm')
      .replace(/(\d)\s*(?:centim[eè]tres?|cm)\b/gi, '$1 cm');
    if (o.expand) ABBR.forEach(function(a) { t = t.replace(a[0], a[1]); });
    t = t.split('\n').map(function(l) { return l.replace(/[ \t]+/g, ' ').trim(); }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    return t;
  }

  }

  function chunkText(clean, o) {
    var min = Math.max(5, +o.min || 20), max = Math.max(min + 2, +o.max || 30), out = [], section = '', buf = [];
    function flush() {
      if (buf.length) {
        out.push({ section: section, text: buf.join(' '), words: buf.length });
        buf = [];
      }
    }
    function units(s) {
      var w = s.split(/\s+/).filter(Boolean);
      if (w.length <= max) return [w];
      var parts = s.replace(/([,;:])\s+/g, '$1\u0001').split('\u0001'), res = [];
      parts.forEach(function(p) {
        var pw = p.split(/\s+/).filter(Boolean);
        for (var i = 0; i < pw.length; i += max) res.push(pw.slice(i, i + max));
      });
      return res;
    }
    clean.split('\n').forEach(function(line) {
      line = line.trim();
      if (!line) { flush(); return; }
      if (isHeading(line)) { flush(); section = line.replace(/:$/, ''); return; }
      if (/^(rang|tour|row|rnd|rd)\b/i.test(line) && buf.length >= min / 2) flush();
      line.replace(/([.!?])\s+(?=[A-ZÉÈÀ0-9*(\[])/g, '$1\u0001').split('\u0001').forEach(function(sent) {
        units(sent).forEach(function(w) {
          if (buf.length + w.length > max) flush();
          buf = buf.concat(w);
          if (buf.length >= min) flush();
        });
      });
    });
    flush();
    return out.map(function(c, i) { c.i = i + 1; return c; });
  }

  function proc(p) {

      c = { clean: clean, chunks: chunkText(clean, S.opts) };
      procCache.set(k, c);
    }
    return c;
  }

  async function pdfToPages(file) {
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise, pages = [];
    for (var n = 1; n <= pdf.numPages; n++) {
      var page = await pdf.getPage(n), tc = await page.getTextContent(), rows = [];
      tc.items.forEach(function(it) {
        if (!it.str) return;
        var y = Math.round(it.transform[5]), x = it.transform[4], row = rows.find(function(r) { return Math.abs(r.y - y) <= 2; });
        if (!row) { row = { y: y, items: [] }; rows.push(row); }
        row.items.push({ x: x, s: it.str, w: it.width });
      });
      rows.sort(function(a, b) { return b.y - a.y; });
      pages.push(rows.map(function(r) {
        r.items.sort(function(a, b) { return a.x - b.x; });
        var s = '', px = null;
        r.items.forEach(function(it) {
          if (px !== null && it.x - px > 1.5 && !/^\s/.test(it.s) && !/\s$/.test(s)) s += ' ';
          s += it.s;
          px = it.x + it.w;
        });
        return s.replace(/\s+/g, ' ').trim();
      }).filter(Boolean));
    }
    return { pages: pages, pdf: pdf };
  }

  async function shrink(file, max) {
    var bmp;
    try {
      bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e) {
      bmp = await new Promise(function(res, rej) {
        var im = new Image();
        im.onload = function() { res(im); };
        im.onerror = rej;
        im.src = URL.createObjectURL(file);
      });
    }
    var w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, r = Math.min(1, max / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.round(w * r);
    c.height = Math.round(h * r);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(function(res) { c.toBlob(function(b) { res(b); }, 'image/jpeg', 0.86); });
  }

  async function addPhotos(p, files, kind) {
    S.busy = 'Enregistrement des photos…';
    render();
    var n = 0;
    for (var i = 0; i < files.length; i++) {
      try {
        var b = await shrink(files[i], 1600);
        var id = 'img_' + uid();
        await saveBlob(id, b);
        p.photos = (p.photos || []).concat([{ id: id, kind: kind }]);
        n++;
      } catch (e) {
        toast('Photo ignorée (' + ((e && e.message) || 'erreur') + ')');
      }
    }
    S.busy = '';
    persist();
    render();
    if (n) toast(n + ' photo(s) ajoutée(s).');
  }

  function blobToBase64(blob) {
    return new Promise(function(resolve, reject) {
      var fr = new FileReader();
      fr.onload = function() {
        var res = String(fr.result || '');
        var idx = res.indexOf(',');
        resolve(idx >= 0 ? res.slice(idx + 1) : res);
      };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  /* ============ Appels Gemini API (Texte, JSON structuré, Vision/OCR) ============ */
  async function callGemini(prompt, options) {
    options = options || {};
    var apiKey = (S.opts.apiKey || '').trim();
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=' + encodeURIComponent(apiKey);
    var parts = [{ text: prompt }];

    if (options.images && options.images.length) {
      for (var i = 0; i < options.images.length; i++) {
        var b = options.images[i];
        var b64 = await blobToBase64(b);
        parts.push({
          inlineData: {
            mimeType: b.type || 'image/jpeg',
            data: b64
          }
        });
      }
    }

    var payload = {
      contents: [{ role: 'user', parts: parts }]
    };
    if (options.json) {
      payload.generationConfig = { responseMimeType: 'application/json' };
    }

    var delays = [1000, 2000, 4000];
    var lastErr = null;
    for (var attempt = 0; attempt <= delays.length; attempt++) {
      if (options.signal && options.signal.aborted) {
        var ae = new Error('Annulé');
        ae.code = 'cancelled';
        throw ae;
      }
      try {
        var resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: options.signal
        });
        if (resp.status === 429 && attempt < delays.length) {
          await new Promise(function(r) { setTimeout(r, delays[attempt]); });
          continue;
        }
        var data = await resp.json().catch(function() { return null; });
        if (!resp.ok) {
          var errMsg = (data && data.error && data.error.message) || ('Erreur HTTP ' + resp.status);
          var err = new Error(errMsg);
          err.status = resp.status;
          throw err;
        }
        var text = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
        if (!text) throw new Error('Réponse vide de l\'IA');
        if (options.json) {
          var cleanJson = text.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
          return JSON.parse(cleanJson);
        }
        return text;
      } catch (e) {
        if (e && e.name === 'AbortError') {
          e.code = 'cancelled';
          throw e;
        }
        lastErr = e;
        if (attempt < delays.length && (!e.status || e.status >= 500)) {
          await new Promise(function(r) { setTimeout(r, delays[attempt]); });
        } else {
          break;
        }
      }
    }
    throw lastErr || new Error('Échec de la requête IA');
  }

  function aiMsg(e) {
    if (!e) return 'L\'analyse a échoué.';
    if (e.code === 'cancelled') return 'Analyse annulée.';
    if (e.status === 400 || e.status === 403) return 'Clé API manquante ou refusée. Vous pouvez en saisir une dans l\'onglet « Ajouter » > Réglages IA.';
    if (e.status === 429) return 'Trop de demandes. Réessayez dans quelques instants.';
    return 'Erreur IA : ' + (e.message || 'réessayez');
  }

  /* ============ Création, détection heuristique et contrôles ============ */
  function guessAuthor(t) {
    t = String(t || '').slice(0, 8000);
    var cues = /(editor and designer|designed by|design by|designer|pattern by|created by|conçu par|créé par|modèle de|créatrice|créateur)\s*:?\s*/ig, m;
    while ((m = cues.exec(t))) {
      var rest = t.slice(m.index + m[0].length, m.index + m[0].length + 70);
      var n = rest.match(/^([A-ZÀ-Ý][\p{L}'’.-]+(?:[ \t]+[A-ZÀ-Ý][\p{L}'’.-]+){0,3})/u);
      if (n) return n[1].trim().replace(/[.,;:]+$/, '');
    }
    var c = t.match(/©\s*(?:\d{4}\s*)?([A-ZÀ-Ý][\p{L}'’.-]+(?:[ \t]+[A-ZÀ-Ý][\p{L}'’.-]+){0,2})/u);
    return c ? c[1].trim() : '';
  }

  var GARMENT_RE = [
    [/cardigan|gilet\b/i, 'Cardigan'], [/sweater|pullover|jumper|\bpull\b/i, 'Pull'],
    [/\b(?:hat|beanie|bonnet)\b/i, 'Bonnet'], [/scarf|snood|[eé]charpe|cowl/i, 'Écharpe / snood'],
    [/shawl|ch[aâ]le/i, 'Châle'], [/\bsocks?\b|chaussettes/i, 'Chaussettes'],
    [/mittens?|gloves?|mitaines|gants/i, 'Mitaines / gants'], [/blanket|couverture|plaid/i, 'Couverture'],
    [/\bdress\b|\brobe\b/i, 'Robe'], [/\bskirt\b|\bjupe\b/i, 'Jupe'],
    [/\b(?:tank|top|d[eé]bardeur)\b/i, 'Top / débardeur'], [/\bvest\b/i, 'Gilet sans manches'],
    [/\bbag\b|\bsac\b/i, 'Sac']
  ];
  function guessGarment(t) {
    t = String(t || '').slice(0, 4000);
    for (var i = 0; i < GARMENT_RE.length; i++) if (GARMENT_RE[i][0].test(t)) return GARMENT_RE[i][1];
    return '';
  }

  function newPattern(title, raw, source) {
    var p = {
      id: uid(),
      title: title || 'Patron sans titre',
      created: Date.now(),
      status: 'brouillon',
      source: source || {},
      raw: raw || '',
      f: {},
      g: { measures: {}, counts: {} },
      photos: [],
      ai: {},
      ev: {},
      gai: {},
      opts: []
    };
    var a = guessAuthor(raw);
    if (a) { p.f.designer = a; p.ai.designer = 1; p.ev.designer = 'Repéré dans le texte du patron'; }
    var g = guessGarment((title || '') + ' ' + (raw || '').slice(0, 1500));
    if (g) { p.f.garment = g; p.ai.garment = 1; p.ev.garment = 'Déduit du titre et du texte'; }
    return p;
  }

  function gkey(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function normAuthor(s) { return String(s || '').replace(/\s+/g, ' ').replace(/[.,;:]+$/, '').trim(); }

  function folderFor(name) {
    var k = gkey(name), f = S.folders.find(function(x) { return gkey(x.name) === k; });
    if (!f) {
      f = { id: 'd' + uid(), name: name, created: Date.now() };
      S.folders.push(f);
      saveFolders();
    }
    return f;
  }
  function autoFile(p, mode) {
    var name = mode === 'author' ? normAuthor(p.f.designer) : String(p.f.garment || '');
    if (!name || p.folder) return false;
    p.folder = folderFor(name).id;
    persist();
    return true;
  }
  function autoFileAll(mode) {
    var n = 0;
    S.patterns.forEach(function(p) { if (autoFile(p, mode)) n++; });
    toast(n ? n + ' patron(s) classé(s).' : 'Rien à classer : renseignez ' + (mode === 'author' ? 'l\'auteur' : 'la pièce') + ' dans les fiches.');
  }

  function filled(v) { return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== null && v !== ''); }
  function completeness(p) {
    var tot = 0, done = 0;
    ALLF.forEach(function(f) { if (f.core) { tot++; if (filled(p.f[f.k])) done++; } });
    var sizes = p.f.sizes || [];
    ['measures', 'counts'].forEach(function(g) {
      CORE_ROWS[g].forEach(function(r) {
        sizes.forEach(function(s) {
          tot++;
          var v = (p.g[g][r] || {})[s];
          if (filled(v)) done++;
        });
      });
    });
    tot += 2;
    var ph = p.photos || [];
    if (ph.some(function(x) { return x.kind !== 'fini'; })) done++;
    if (ph.some(function(x) { return x.kind === 'fini'; })) done++;
    return tot ? done / tot : 0;
  }

  function checks(p) {
    var out = [], f = p.f, sizes = f.sizes || [], g = p.g, gs = +f.gauge_sts, gr = +f.gauge_rows;
    if (!(p.raw || '').trim()) out.push(['bad', 'Aucun texte de patron. Importez un PDF ou collez le texte.']);
    if (!gs || !gr) out.push(['bad', 'Échantillon incomplet : indiquez les mailles et les rangs pour 10 cm.']);
    if (!sizes.length) out.push(['bad', 'Aucune taille sélectionnée.']);
    MEASURES.forEach(function(m) {
      var vals = sizes.map(function(s) { return [s, +(g.measures[m[0]] || {})[s]]; }).filter(function(x) { return x[1]; });
      for (var i = 1; i < vals.length; i++) {
        if (vals[i][1] < vals[i - 1][1]) {
          out.push(['warn', m[1] + ' : la taille ' + vals[i][0] + ' (' + vals[i][1] + ') est plus petite que ' + vals[i - 1][0] + ' (' + vals[i - 1][1] + ').']);
          break;
        }
      }
    });
    var okc = 0;
    if (gs) sizes.forEach(function(s) {
      var b = +(g.measures.bust || {})[s], c = +(g.counts.chest || {})[s];
      if (b && c) {
        var w = c / gs * 10, d = Math.abs(w - b) / b;
        if (d > 0.04) out.push(['warn', 'Taille ' + s + ' : ' + c + ' mailles donnent environ ' + Math.round(w) + ' cm avec cet échantillon, le tableau indique ' + b + ' cm (écart ' + Math.round(d * 100) + ' %).']);
        else okc++;
      }
    });
    if (okc) out.push(['ok', okc + ' taille(s) : mailles et tour de poitrine concordent avec l\'échantillon.']);
    sizes.forEach(function(s) {
      var a = +(g.counts.caston || {})[s];
      if (a && a % 2 && /c[oô]tes/i.test(f.hem || '')) out.push(['warn', 'Taille ' + s + ' : montage de ' + a + ' mailles (impair) pour des côtes, à vérifier.']);
    });
    var rs = +f.r_sts;
    if (gs && rs && Math.abs(rs - gs) / gs > 0.05) out.push(['warn', 'Échantillon obtenu (' + rs + ') différent du patron (' + gs + ') : utilisez le simulateur ci-dessous.']);
    var ph = p.photos || [];
    if (!ph.some(function(x) { return x.kind !== 'fini'; })) out.push(['warn', 'Pas de photo ni de croquis du patron.']);
    if (!ph.some(function(x) { return x.kind === 'fini'; })) out.push(['warn', 'Pas de photo du résultat tricoté : ce patron ne servira que pour la lecture, pas pour la vérification.']);
    if (filled(f.r_rating) && !ph.some(function(x) { return x.kind === 'fini'; })) out.push(['warn', 'Une note est donnée sans photo du résultat.']);
    (p.opts || []).forEach(function(o) {
      if (!o.name) out.push(['warn', 'Une option du groupe « ' + o.group + ' » n\'a pas de nom.']);
      if (o.group === 'Manches' && sizes.length) {
        var ms = sizes.filter(function(s) { return !filled(((o.measures || {}).sleeve || {})[s]); }).length;
        if (ms) out.push(['warn', 'Option « ' + o.name + ' » : longueur de manche manquante pour ' + ms + ' taille(s).']);
      }
    });
    var mt = 0;
    sizes.forEach(function(s) { CORE_ROWS.measures.forEach(function(r) { if (!filled((g.measures[r] || {})[s])) mt++; }); });
    if (mt) out.push(['warn', mt + ' mesure(s) clé(s) manquante(s) dans le tableau des tailles.']);
    return out;
  }

  /* ============ Extraction IA & Application des résultats ============ */
  function coerce(f, v) {
    if (v === undefined || v === null || v === '') return undefined;
    if (f.t === 'select') { v = String(v); return f.o.indexOf(v) >= 0 ? v : undefined; }
    if (f.t === 'multi') {
      if (!Array.isArray(v)) return undefined;
      v = v.filter(function(x) { return f.o.indexOf(x) >= 0; });
      return v.length ? v : undefined;
    }
    if (f.t === 'number') { v = parseFloat(v); return isNaN(v) ? undefined : v; }
    return String(v).slice(0, 600);
  }
  function fieldDef(k) { return ALLF.find(function(x) { return x.k === k; }); }

  function applyAI(p, res, keys, over) {
    var n = 0;
    res = res || {};
    var fl = res.fields || (keys ? res : {});
    p.ev = p.ev || {};
    ALLF.forEach(function(f) {
      if (f.k.indexOf('r_') === 0) return;
      if (keys && keys.indexOf(f.k) < 0) return;
      var raw = fl[f.k], q = '';
      if (raw && typeof raw === 'object' && !Array.isArray(raw) && 'v' in raw) { q = raw.q || ''; raw = raw.v; }
      var v = coerce(f, raw);
      if (v === undefined) return;
      if (filled(p.f[f.k]) && !(over && p.ai[f.k])) return;
      p.f[f.k] = v;
      p.ai[f.k] = 1;
      if (q) p.ev[f.k] = String(q).slice(0, 160);
      n++;
    });
    if (p.f.sizes) p.f.sizes.sort(function(a, b) { return SIZES.indexOf(a) - SIZES.indexOf(b); });
    if (!keys && res.size_map && typeof res.size_map === 'object' && (!filled(p.f.size_map) || (over && p.ai.size_map))) {
      var sm = Object.keys(res.size_map).filter(function(s) { return SIZES.indexOf(s) >= 0; }).map(function(s) { return s + ' = ' + res.size_map[s]; }).join(', ');
      if (sm) { p.f.size_map = sm; p.ai.size_map = 1; n++; }
    }
    return n;
  }

  function putGrid(p, target, kind, rows, src, prefix, over, used) {
    var n = 0;
    if (!src || typeof src !== 'object') return 0;
    rows.forEach(function(r) {
      var row = src[r[0]];
      if (!row || typeof row !== 'object') return;
      Object.keys(row).forEach(function(sz) {
        if (SIZES.indexOf(sz) < 0) return;
        var v = parseFloat(row[sz]);
        if (isNaN(v)) return;
        var t = target[kind][r[0]] = target[kind][r[0]] || {}, key = prefix + kind + '.' + r[0] + '.' + sz;
        if (!filled(t[sz]) || (over && p.gai[key])) {
          t[sz] = v;
          p.gai[key] = 1;
          if (used) used[sz] = 1;
          n++;
        }
      });
    });
    return n;
  }

  function applyGrids(p, res, over) {
    p.gai = p.gai || {};
    var used = {}, n = 0;
    res = res || {};
    n += putGrid(p, p.g, 'measures', MEASURES, res.measures, '', over, used);
    n += putGrid(p, p.g, 'counts', COUNTS, res.counts, '', over, used);
    if (!(p.f.sizes || []).length) {
      var us = Object.keys(used).sort(function(a, b) { return SIZES.indexOf(a) - SIZES.indexOf(b); });
      if (us.length) { p.f.sizes = us; p.ai.sizes = 1; }
    }
    return n;
  }

  function findOpt(p, g, name) {
    var k = (String(g) + '|' + String(name)).toLowerCase();
    return (p.opts || []).find(function(o) { return (o.group + '|' + o.name).toLowerCase() === k; });
  }

  function applyOptGrids(p, list, over) {
    var n = 0;
    if (!Array.isArray(list)) return 0;
    p.gai = p.gai || {};
    list.forEach(function(it) {
      var o = it && findOpt(p, it.group, it.name);
      if (!o) return;
      var def = GROUPDEF[o.group] || GROUPDEF.Autre;
      o.measures = o.measures || {};
      o.counts = o.counts || {};
      n += putGrid(p, o, 'measures', MEASURES.filter(function(r) { return def.m.indexOf(r[0]) >= 0; }), it.measures, o.id + '.', over, null);
      n += putGrid(p, o, 'counts', COUNTS.filter(function(r) { return def.c.indexOf(r[0]) >= 0; }), it.counts, o.id + '.', over, null);
    });
    return n;
  }

  function mergeOptions(p, list, over) {
    if (!Array.isArray(list)) return 0;
    p.opts = p.opts || [];
    var n = 0;
    if (over) p.opts = p.opts.filter(function(o) { return !o.ai; });
    list.forEach(function(o) {
      if (!o || !o.name || !GROUPDEF[o.group]) return;
      if (findOpt(p, o.group, o.name)) return;
      var def = GROUPDEF[o.group], of = {};
      Object.keys(o.fields || {}).forEach(function(k) {
        if (def.fields.indexOf(k) < 0) return;
        var f = fieldDef(k);
        if (!f) return;
        var raw = o.fields[k];
        if (raw && typeof raw === 'object' && 'v' in raw) raw = raw.v;
        var v = coerce(f, raw);
        if (v !== undefined) of[k] = v;
      });
      p.opts.push({
        id: uid(),
        group: o.group,
        name: String(o.name).slice(0, 80),
        desc: String(o.desc || '').slice(0, 500),
        f: of,
        measures: {},
        counts: {},
        q: String(o.q || '').slice(0, 160),
        ai: 1
      });
      n++;
    });
    return n;
  }

  function specText(keys) {
    return ALLF.filter(function(f) { return keys ? keys.indexOf(f.k) >= 0 : f.k.indexOf('r_') !== 0; }).map(function(f) {
      return f.k + ' (' + ({
        text: 'texte court',
        long: 'texte',
        number: 'nombre' + (f.u ? ' en ' + f.u : ''),
        select: 'une valeur parmi : ' + (f.o || []).join(' | '),
        multi: 'liste de valeurs parmi : ' + (f.o || []).join(' | ')
      }[f.t]) + ') = ' + f.l;
    }).join('\n');
  }
  function groupSpec() {
    return GROUP_NAMES.map(function(g) { var d = GROUPDEF[g]; return '- ' + g + (d.fields.length ? ' (clés permises : ' + d.fields.join(', ') + ')' : ''); }).join('\n');
  }
  function rowSpec() {
    return 'Lignes de "measures" (cm) :\n' + MEASURES.map(function(m) { return m[0] + ' = ' + m[1]; }).join('\n') + '\n\nLignes de "counts" :\n' + COUNTS.map(function(m) { return m[0] + ' = ' + m[1]; }).join('\n');
  }
  function optList(p) {
    var l = (p.opts || []).map(function(o) { var d = GROUPDEF[o.group] || GROUPDEF.Autre; return '- groupe "' + o.group + '", nom "' + o.name + '" (lignes permises : ' + d.m.concat(d.c).join(', ') + ')'; });
    return l.length ? l.join('\n') : '(aucune variante détectée)';
  }
  function sizeInfo(p) {
    return (p.f.sizes && p.f.sizes.length ? p.f.sizes.join(', ') : 'à déterminer parmi XS, S, M, L, XL, XXL, 3XL (une seule taille : utilise M)') + (p.f.size_map ? '. Noms dans le patron : ' + p.f.size_map : '');
  }

  function prompt1(txt) {
    return 'Tu es spécialiste des patrons de tricot. Lis TOUT le texte ci-dessous et remplis la fiche technique. Réponds avec un seul objet JSON, sans autre texte :\n' +
      '{"fields":{"<clé>":{"v":<valeur>,"q":"citation courte du patron, 15 mots maximum"}},"size_map":{"XS":"nom ou numéro de cette taille dans le patron"},"options":[{"group":"<groupe>","name":"<nom du choix>","desc":"<une phrase>","fields":{"<clé>":<valeur>},"q":"citation courte"}]}\n\n' +
      'Règles :\n1. N\'invente rien. Omets toute clé que le texte ne permet pas de remplir. Pas de valeur approximative.\n' +
      '2. Pour un champ à choix, "v" reprend exactement une valeur de la liste. Pour une liste, "v" est un tableau de valeurs exactes de la liste.\n' +
      '3. Tailles : associe les tailles du patron, dans l\'ordre croissant, aux étiquettes XS, S, M, L, XL, XXL, 3XL (par exemple 34/36 = XS). Le champ "sizes" contient seulement les tailles réellement proposées. Note la correspondance dans "size_map".\n' +
      '4. VARIANTES : beaucoup de patrons proposent plusieurs choix (manches longues, 3/4 ou courtes ; encolure ronde ou en V ; bas en côtes ou en point mousse ; boutons ou zip ; avec ou sans poches ; versions courte et longue). Mets chaque choix dans "options", une entrée par choix, y compris le choix par défaut. Groupes possibles (avec les clés permises dans "fields" de l\'option) :\n' + groupSpec() + '\n' +
      '   Dans la fiche principale ("fields"), mets la variante par défaut : celle de la photo principale, sinon la première citée.\n' +
      '5. Ne remplis aucune clé qui commence par r_ (elle concerne le résultat tricoté).\n' +
      '6. Les mesures et nombres de mailles par taille seront demandés à l\'étape suivante : ne les mets pas ici.\n' +
      '7. Auteur : mets dans "designer" le nom de la créatrice, du créateur ou de la marque (couverture, crédits, "designed by", droits d\'auteur). Donne la citation correspondante.\n\n' +
      'Champs de la fiche :\n' + specText(null) + '\n\nTexte du patron :\n' + txt;
  }

  function prompt2(txt, p) {
    return 'Tu lis un patron de tricot pour remplir deux tableaux par taille. Tailles proposées : ' + sizeInfo(p) + '.\n' +
      'Réponds uniquement avec un objet JSON : {"measures":{"<ligne>":{"<taille>":nombre}},"counts":{"<ligne>":{"<taille>":nombre}},"options":[{"group":"<groupe>","name":"<nom>","measures":{...},"counts":{...}}]}\n\n' +
      'Règles :\n1. N\'invente rien. Un nombre seul par cellule. Omets une cellule absente du texte.\n' +
      '2. Quand le patron écrit "S (M, L, XL)" ou "96 (104, 112, 120)", la première valeur est la plus petite taille proposée, la suivante la taille suivante, et ainsi de suite. Une valeur unique vaut pour toutes les tailles.\n' +
      '3. Recopie exactement les nombres écrits, sans calcul. "chest" = nombre de mailles à la largeur maximale du corps.\n' +

  async function analyze(p, o) {

    } catch (e) {

    }
    if (ok) {
      try {
        S.busy = 'Étape 2 sur 2 : tableaux par taille…';

    }
    if (ok && S.opts.autoFile && !p.folder) autoFile(p, S.opts.autoFile);
    S.busy = '';
    render();
    return ok;

  async function renderPages(pdf, a, b) {
    var imgs = [];
    for (var n = a; n <= b; n++) {
      var page = await pdf.getPage(n), vp = page.getViewport({ scale: 1.5 }), c = document.createElement('canvas');
      c.width = vp.width;
      c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      imgs.push(await new Promise(function(r) { c.toBlob(r, 'image/jpeg', 0.85); }));
    }
    return imgs;
  }

  /* ============ Import PDF, Miniatures et Visionneuse ============ */
  async function storeThumb(p, pdf) {
    var page = await pdf.getPage(1), v0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 360 / v0.width });
    var c = document.createElement('canvas');
    c.width = Math.round(vp.width);
    c.height = Math.round(vp.height);
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    var b = await new Promise(function(res) { c.toBlob(res, 'image/jpeg', 0.8); });
    var tid = 'th_' + p.id;
    await saveBlob(tid, b);
    p.thumb = tid;
    persist();
    if (S.tab === 'lib') render();
  }

  async function handleFiles(files) {
    S.tab = 'add';
    var last = null, made = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') {
        S.log.unshift({ ok: 0, m: f.name + ' : format non supporté (PDF uniquement).' });
        continue;
      }
      S.busy = 'Lecture de ' + f.name + '…';
      render();
      try {
        var r = await pdfToPages(f);
        var raw = r.pages.map(function(pg) { return pg.join('\n'); }).join('\n\f\n');
        var chars = raw.replace(/\s/g, '').length;
        var p = newPattern(f.name.replace(/\.pdf$/i, ''), raw.slice(0, 90000), { file: f.name, pages: r.pages.length });
        if (chars < 150 * Math.max(1, Math.min(r.pages.length, 3))) {
          p.scanned = true;
        }
        var pdfId = 'pdf_' + p.id;
        await saveBlob(pdfId, f);
        p.source.pdf = pdfId;
        pdfs.set(p.id, r);

        if (S.opts.autoFile) autoFile(p, S.opts.autoFile);
        S.patterns.unshift(p);
        persist();
        last = p;
        made.push(p);
        storeThumb(p, r.pdf).catch(function() {});
        S.log.unshift({
          ok: 1,
          m: f.name + ' : ' + r.pages.length + ' page(s), ' + (p.scanned ? 'PDF scanné (image)' : chars + ' caractères extraits')
        });
      } catch (e) {
        S.log.unshift({ ok: 0, m: f.name + ' : lecture impossible (' + ((e && e.message) || 'erreur') + ').' });
      }
    }
    S.busy = '';
    if (last && files.length === 1) openP(last.id);
    else render();

    if (S.opts.auto && made.length) {
      for (var j = 0; j < made.length; j++) {
        var q = made[j];
        if (q.scanned) {
          var rd = await aiRead(q);
          S.busy = '';
          if (!rd) continue;
        }
        await analyze(q);
      }
    }
  }

  async function getPdf(p) {
    var d = pdfs.get(p.id);
    if (d && d.pdf) return d;
    if (!p.source || !p.source.pdf) return null;
    try {
      var b = await loadBlob(p.source.pdf);
      if (!b) return null;
      var buf = await b.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      d = { pdf: pdf };
      pdfs.set(p.id, d);
      return d;
    } catch (e) {
      return null;
    }
  }

  async function queueThumbs() {
    if (thumbQ) return;
    thumbQ = true;
    try {
      var list = S.patterns.slice();
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        if (p.thumb) {
          await loadBlob(p.thumb);
          continue;
        }
        if (thumbTried[p.id]) continue;
        if (!(pdfs.has(p.id) || (p.source && p.source.pdf))) continue;
        thumbTried[p.id] = 1;
        var d = await getPdf(p);
        if (!d) continue;
        await storeThumb(p, d.pdf);
      }
      resolveLazyImages();
    } catch (e) {}
    thumbQ = false;
  }

  async function attachPdf(p, f) {
    S.busy = 'Enregistrement du PDF…';
    render();
    try {
      var buf = await f.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
      pdfs.set(p.id, { pdf: pdf });
      p.source = p.source || {};
      var pdfId = 'pdf_' + p.id;
      await saveBlob(pdfId, f);
      p.source.pdf = pdfId;
      p.source.file = p.source.file || f.name;
      p.source.pages = pdf.numPages;
      delete p.thumb;
      await storeThumb(p, pdf);
      persist();
      toast('PDF associé au patron.');
    } catch (e) {
      toast('Impossible d\'associer ce PDF.');
    }
    S.busy = '';
    render();
  }

  function pageLabel() {
    var box = $('#vscroll'), ref = box.scrollTop + box.clientHeight / 3, n = 1;
    V.pages.forEach(function(pg, i) { if (pg.el.offsetTop <= ref) n = i + 1; });
    $('#vpage').textContent = V.pages.length ? n + ' / ' + V.pages.length : '';
  }

  async function renderVisible() {
    if (V.running) { V.again = true; return; }
    V.running = true;
    try {
      do {
        V.again = false;
        var box = $('#vscroll'), top = box.scrollTop, bot = top + box.clientHeight;
        for (var i = 0; i < V.pages.length && V.pdf; i++) {
          var pg = V.pages[i], el = pg.el, y = el.offsetTop, h = el.offsetHeight;
          var near = !(y + h < top - 900 || y > bot + 900), far = (y + h < top - 3000 || y > bot + 3000);
          if (far && pg.done) { el.innerHTML = ''; el.style.aspectRatio = pg.ar; pg.done = false; continue; }
          if (!near || pg.done) continue;
          var page = await V.pdf.getPage(i + 1);
          if (!V.pdf) break;
          var v0 = page.getViewport({ scale: 1 }), dpr = Math.min(window.devicePixelRatio || 1, V.zoom > 1 ? 1.5 : 2);
          var vp = page.getViewport({ scale: (el.clientWidth || 320) * dpr / v0.width });
          var c = document.createElement('canvas');
          c.width = Math.floor(vp.width);
          c.height = Math.floor(vp.height);
          await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          el.innerHTML = '';
          el.appendChild(c);
          el.style.aspectRatio = '';
          pg.done = true;
        }
      } while (V.again && V.pdf);
    } catch (e) {}
    V.running = false;
  }

  async function buildViewer() {
    var box = $('#vscroll');
    box.innerHTML = '';
    box.style.setProperty('--z', V.zoom);
    V.pages = [];
    var first = await V.pdf.getPage(1), v = first.getViewport({ scale: 1 }), ar = v.width + ' / ' + v.height;
    for (var n = 1; n <= V.pdf.numPages; n++) {
      var d = document.createElement('div');
      d.className = 'vpage';
      d.style.aspectRatio = ar;
      box.appendChild(d);
      V.pages.push({ el: d, done: false, ar: ar });
    }
    box.scrollTop = 0;
    pageLabel();
    renderVisible();
  }

  /* ============ Export & Sauvegarde / Restauration ============ */
  function brief(p) {
    var f = p.f, b = [];
    b.push('Crée un patron de tricot' + (f.garment ? ' : ' + f.garment.toLowerCase() : '') + (f.target ? ' pour ' + f.target.toLowerCase() : '') + '.');
    var d = [];
    ['silhouette', 'length', 'neckline', 'sleeves', 'sleeve_shape', 'shoulder', 'construction'].forEach(function(k) { if (filled(f[k])) d.push(f[k]); });
    if (d.length) b.push('Coupe : ' + d.join(', ') + '.');
    if (filled(f.ease_cm)) b.push('Aisance au buste : ' + f.ease_cm + ' cm.');
    if ((f.sizes || []).length) b.push('Tailles : ' + f.sizes.join(', ') + '.');
    if (f.gauge_sts && f.gauge_rows) b.push('Échantillon : ' + f.gauge_sts + ' mailles et ' + f.gauge_rows + ' rangs pour 10 cm' + (f.needle_mm ? ' avec des aiguilles de ' + f.needle_mm + ' mm' : '') + '.');
    if (f.yarn_weight || f.yarn_fiber) b.push('Fil : ' + [f.yarn_weight, f.yarn_fiber].filter(Boolean).join(', ') + '.');
    if ((f.stitches || []).length) b.push('Points : ' + f.stitches.join(', ') + '.');
    var fin = [f.hem, f.neck_finish, f.closure].filter(Boolean);
    if (fin.length) b.push('Finitions : ' + fin.join(' ; ') + '.');
    var og = {};
    (p.opts || []).forEach(function(o) { if (o.name) (og[o.group] = og[o.group] || []).push(o.name); });
    Object.keys(og).forEach(function(g) { if (og[g].length > 1) b.push('Options (' + g.toLowerCase() + ') : ' + og[g].join(', ') + '.'); });
    return b.join(' ');
  }

  function photoFile(ph) { return 'photos/' + ph.id + '.jpg'; }
  function selected() { return S.patterns.filter(function(p) { return !S.exp.valid || p.status === 'validé'; }); }

  function buildFiles() {
    var ps = selected(), f = {};
    f['patterns.jsonl'] = ps.map(function(p) {
      var c = proc(p);
      return JSON.stringify({
        id: p.id,
        title: p.title,
        status: p.status,
        folder: p.folder || null,
        source: p.source,
        fields: p.f,
        options: p.opts || [],
        measures: p.g.measures,
        counts: p.g.counts,
        photos: (p.photos || []).map(function(x) { return { id: x.id, file: photoFile(x), kind: x.kind }; }),
        raw: p.raw || '',
        text: c.clean,
        chunks: c.chunks
      });
    }).join('\n');

    f['chunks.jsonl'] = ps.flatMap(function(p) {
      return proc(p).chunks.map(function(c) {
        return JSON.stringify({
          pattern_id: p.id,
          chunk: c.i,
          section: c.section,
          text: c.text,
          words: c.words,
          garment: p.f.garment || null,
          sizes: p.f.sizes || [],
          language: p.f.language || null
        });
      });
    }).join('\n');

    f['finetune.jsonl'] = ps.filter(function(p) { return (p.raw || '').trim(); }).map(function(p) {
      var imgs = (p.photos || []).filter(function(x) { return x.kind !== 'fini'; }).map(photoFile);
      return JSON.stringify({
        messages: [{ role: 'user', content: brief(p) }, { role: 'assistant', content: proc(p).clean }],
        images: imgs,
        finished_images: (p.photos || []).filter(function(x) { return x.kind === 'fini'; }).map(photoFile)
      });
    }).join('\n');

    var cols = ['id', 'title', 'status', 'options'].concat(ALLF.map(function(x) { return x.k; }));
    MEASURES.forEach(function(m) { SIZES.forEach(function(s) { cols.push('measures.' + m[0] + '.' + s); }); });
    COUNTS.forEach(function(m) { SIZES.forEach(function(s) { cols.push('counts.' + m[0] + '.' + s); }); });
    var q = function(v) {
      v = Array.isArray(v) ? v.join('|') : (v == null ? '' : String(v));
      return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    f['patterns.csv'] = [cols.join(',')].concat(ps.map(function(p) {
      return cols.map(function(c) {
        if (c === 'id') return q(p.id);
        if (c === 'title') return q(p.title);
        if (c === 'status') return q(p.status);
        if (c === 'options') return q((p.opts || []).length ? JSON.stringify(p.opts) : '');
        if (c.indexOf('measures.') === 0) { var a = c.split('.'); return q((p.g.measures[a[1]] || {})[a[2]]); }
        if (c.indexOf('counts.') === 0) { var b = c.split('.'); return q((p.g.counts[b[1]] || {})[b[2]]); }
        return q(p.f[c]);
      }).join(',');
    })).join('\n');

    f['schema.json'] = JSON.stringify({
      option_groups: GROUPDEF,
      sizes: SIZES,
      measures: MEASURES,
      counts: COUNTS,
      sections: SCHEMA.map(function(s) {
        return {
          id: s.id,
          title: s.t,
          why: s.why,
          fields: s.f.filter(function(x) { return x.k[0] !== '@'; }).map(function(x) {
            return { key: x.k, label: x.l, type: x.t, options: x.o || null, unit: x.u || null, essential: !!x.core };
          })
        };
      })
    }, null, 2);

    return f;
  }

  function downloadBlob(filename, data) {
    try {
      var blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      toast('Téléchargement impossible.');
      return false;
    }
  }

  async function exportZip() {
    if (!window.JSZip) {
      toast('Module ZIP indisponible. Exportez les fichiers un par un.');
      return;
    }
    S.busy = 'Préparation de l\'archive ZIP…';
    render();
    try {
      var files = buildFiles(), z = new JSZip(), miss = 0;
      Object.keys(files).forEach(function(k) { z.file(k, files[k]); });
      z.file('LISEZMOI.txt', 'Jeu de données de patrons de tricot.\n- patterns.jsonl : un patron complet par ligne (fiche, tableaux, texte nettoyé, blocs).\n- chunks.jsonl : blocs de texte de 20 à 30 mots avec leur section.\n- finetune.jsonl : paires description -> patron, avec les images de référence.\n- patterns.csv : fiches à plat.\n- schema.json : définition de tous les champs.\n- photos/ : photos et croquis.\n');
      if (S.exp.photos) {
        var ids = {};
        selected().forEach(function(p) { (p.photos || []).forEach(function(x) { ids[x.id] = 1; }); });
        var idList = Object.keys(ids);
        for (var i = 0; i < idList.length; i++) {
          var id = idList[i];
          var bl = await loadBlob(id);
          if (bl) z.file('photos/' + id + '.jpg', bl);
          else miss++;
        }
      }
      var blob = await z.generateAsync({ type: 'blob' });
      S.busy = '';
      render();
      if (downloadBlob('carnet-patrons.zip', blob)) {
        toast('Archive téléchargée' + (miss ? ' (' + miss + ' photo(s) manquante(s))' : '.'));
      }
    } catch (e) {
      S.busy = '';
      render();
      toast('Erreur lors de la création de l\'archive.');
    }
  }

  async function restoreBackup(file) {
    S.busy = 'Restauration de la sauvegarde…';
    render();
    try {
      var jsonlText = '';
      var zipObj = null;
      if (/\.zip$/i.test(file.name)) {
        if (!window.JSZip) throw new Error('JSZip indisponible');
        zipObj = await JSZip.loadAsync(file);
        var entry = zipObj.file('patterns.jsonl');
        if (!entry) throw new Error('Fichier patterns.jsonl introuvable dans l\'archive');
        jsonlText = await entry.async('string');
      } else {
        jsonlText = await file.text();
      }

      var lines = jsonlText.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
      var added = 0, updated = 0;
      for (var i = 0; i < lines.length; i++) {
        var rec = JSON.parse(lines[i]);
        if (!rec || !rec.id) continue;
        var photos = [];
        if (Array.isArray(rec.photos)) {
          for (var j = 0; j < rec.photos.length; j++) {
            var ph = rec.photos[j];
            var phId = ph.id || (ph.file ? ph.file.replace(/^photos\/|\.jpg$/g, '') : 'img_' + uid());
            if (zipObj && ph.file && zipObj.file(ph.file)) {
              var phBlob = await zipObj.file(ph.file).async('blob');
              await saveBlob(phId, phBlob);
            }
            photos.push({ id: phId, kind: ph.kind || 'modele' });
          }
        }
        var pat = {
          id: rec.id,
          title: rec.title || 'Patron restauré',
          created: rec.created || Date.now(),
          status: rec.status || 'brouillon',
          folder: rec.folder || undefined,
          source: rec.source || {},
          raw: rec.raw || rec.text || '',
          f: rec.fields || {},
          g: { measures: rec.measures || {}, counts: rec.counts || {} },
          photos: photos,
          ai: {},
          ev: {},
          gai: {},
          opts: rec.options || []
        };
        var idx = S.patterns.findIndex(function(x) { return x.id === pat.id; });
        if (idx >= 0) {
          S.patterns[idx] = pat;
          updated++;
        } else {
          S.patterns.unshift(pat);
          added++;
        }
      }
      persist();
      S.busy = '';
      render();
      toast('Restauration terminée : ' + added + ' ajouté(s), ' + updated + ' mis à jour.');
    } catch (e) {
      S.busy = '';
      render();
      toast('Erreur de restauration : ' + ((e && e.message) || 'fichier invalide'));
    }
  }

  function groupsOf(ps, mode) {
    var map = {}, order = [];
    function add(key, label, fid, p) {
      if (!map[key]) { map[key] = { key: key, label: label, fid: fid, ps: [] }; order.push(key); }
      if (p) map[key].ps.push(p);
    }
    if (mode === 'folder') S.folders.forEach(function(f) { add(f.id, f.name, f.id, null); });
    ps.forEach(function(p) {
      if (mode === 'folder') {
        var f = S.folders.find(function(x) { return x.id === p.folder; });
        if (f) add(f.id, f.name, f.id, p);
        else add('_none', 'Sans dossier', null, p);
      } else if (mode === 'author') {
        var a = normAuthor(p.f.designer);
        add(a ? gkey(a) : '_none', a || 'Auteur inconnu', null, p);
      } else {
        var g = p.f.garment;
        add(g ? gkey(g) : '_none', g || 'Pièce non précisée', null, p);
      }
    });
    var arr = order.map(function(k) { return map[k]; });
    if (S.q.trim() || S.fStatus !== 'all' || S.fDiff !== 'all') {
      arr = arr.filter(function(g) { return g.ps.length; });
    }
    arr.sort(function(a, b) {
      if (a.key === '_none') return 1;
      if (b.key === '_none') return -1;
      return String(a.label).localeCompare(String(b.label), 'fr');
    });
    return arr;
  }

    var secs = SCHEMA.map(function(s) {

        s.f.map(function(f) {

    return '<div class="stack">' + ai + optsHtml(p) + secs + '<p class="hint"><span class="core"></span> Champ essentiel pour que la fiche soit comptée comme complète.</p></div>';

  function tabTexte(p) {

  function tabPhotos(p) {

  function gaugeSimHtml(p) {
    var gs = +p.f.gauge_sts || 0, gr = +p.f.gauge_rows || 0;
    var sizes = (p.f.sizes && p.f.sizes.length) ? p.f.sizes : SIZES;
    var simSts = +(S.sim.sts || p.f.r_sts || gs || '');

    var content = '';
    if (!gs) {
      content = '<p class="sub">Renseignez d\'abord l\'échantillon du patron (mailles pour 10 cm) dans l\'onglet Fiche pour activer le simulateur.</p>';
    } else {
      var ratioS = simSts ? (simSts / gs) : 1;
      var ratioR = (gr && simRows) ? (simRows / gr) : 1;
      var diffPct = simSts ? Math.round((ratioS - 1) * 100) : 0;
      var rowsToSim = [
        ['caston', 'Montage corps (m.)', ratioS],
        ['chest', 'Tour poitrine (m.)', ratioS],
        ['sl_caston', 'Montage manche (m.)', ratioS],
        ['rows_body', 'Rangs du corps', ratioR]
      ].filter(function(r) {
        return sizes.some(function(s) { return filled((p.g.counts[r[0]] || {})[s]); });
      });

      content = '<div class="row">' +
        '<label class="fl grow"><span class="n">Votre échantillon (m. / 10 cm)</span><input class="in" type="number" inputmode="decimal" step="any" data-sim="sts" placeholder="' + gs + '" value="' + esc(S.sim.sts || p.f.r_sts || '') + '"></label>' +
        '<label class="fl grow"><span class="n">Vos rangs (/ 10 cm)</span><input class="in" type="number" inputmode="decimal" step="any" data-sim="rows" placeholder="' + (gr || '—') + '" value="' + esc(S.sim.rows || p.f.r_rows || '') + '"></label>' +
        '</div>' +
        (simSts && simSts !== gs ? '<p class="sub">Écart de densité : <b>' + (diffPct > 0 ? '+' : '') + diffPct + ' %</b> par rapport au patron (' + gs + ' m.).</p>' : '') +
        (rowsToSim.length ?
          '<div class="scroll-x"><table class="grid"><thead><tr><th></th>' + sizes.map(function(s) { return '<th>' + s + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rowsToSim.map(function(r) {
            return '<tr><td>' + esc(r[1]) + '</td>' + sizes.map(function(s) {
              var orig = +(p.g.counts[r[0]] || {})[s];
              if (!orig) return '<td class="sub">—</td>';
              var conv = Math.round(orig * r[2]);
              return '<td class="num"><b>' + conv + '</b>' + (conv !== orig ? '<br><span class="sub" style="font-size:11px">(' + orig + ')</span>' : '') + '</td>';
            }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>' : '<p class="sub">Remplissez des comptes de mailles dans le tableau des tailles pour voir la conversion.</p>');
    }

    return '<div class="card stack"><h3>Simulateur d\'échantillon (Multi-gauge)</h3>' + content + '</div>';
  }

  function tabChecks(p) {

      gaugeSimHtml(p) +
      '<div class="card stack"><h3>Supprimer</h3>' +

  function tabPdf(p) {

  function viewDet() {

      '<div class="row" style="margin-bottom:12px"><span class="bar grow"><i id="cbar" style="width:' + c + '%"></i></span><span class="sub num" id="cpct">' + c + ' %</span>' + statusChip(p.status) + '</div>' +
      '<label class="fl" style="margin-bottom:12px"><span class="n">Dossier</span><select class="in" data-folder="1" aria-label="Dossier"><option value="">Sans dossier</option>' +
      S.folders.map(function(f) { return '<option value="' + esc(f.id) + '"' + (p.folder === f.id ? ' selected' : '') + '>' + esc(f.name) + '</option>'; }).join('') +
      '</select></label>' +
      '<div class="seg" style="margin-bottom:12px">' + subs.map(function(s) {

  function viewExp() {
    var ps = selected(), chunks = 0, ph = 0;
    ps.forEach(function(p) { chunks += proc(p).chunks.length; ph += (p.photos || []).length; });
    var F = [
      ['patterns.jsonl', 'Patrons complets (JSONL)', 'Fiche, tableaux, texte nettoyé et blocs, un patron par ligne.'],
      ['chunks.jsonl', 'Blocs de texte (RAG)', 'Blocs de 20 à 30 mots avec leur section.'],
      ['finetune.jsonl', 'Paires d\'entraînement', 'Description du vêtement, puis patron, avec les images de référence.'],
      ['patterns.csv', 'Tableur (CSV)', 'Une ligne par patron, tous les champs et tailles.'],
      ['schema.json', 'Schéma des données', 'Définition structurée de tous les champs.']
    ];
    return '<div class="top"><h1>Export & Sauvegarde</h1></div><div class="stack">' +
      '<div class="card stack"><div class="sub num">' + ps.length + ' patron(s) sélectionné(s) · ' + chunks + ' blocs · ' + ph + ' photo(s)</div>' +
      '<label class="toggle"><input type="checkbox" data-exp="valid"' + (S.exp.valid ? ' checked' : '') + '> Seulement les patrons validés</label>' +
      '<label class="toggle"><input type="checkbox" data-exp="photos"' + (S.exp.photos ? ' checked' : '') + '> Inclure les photos dans l\'archive ZIP</label>' +
      '<button class="btn primary" data-act="zip"' + (ps.length ? '' : ' disabled') + '>Télécharger l\'archive complète (.zip)</button>' +
      '</div>' +
      '<h2>Fichiers séparés</h2>' +
      F.map(function(f) {
        return '<div class="card row"><div class="grow"><h3>' + f[1] + '</h3><p class="sub">' + f[2] + '</p></div><button class="btn small" data-act="file" data-v="' + f[0] + '"' + (ps.length ? '' : ' disabled') + '>Télécharger</button></div>';
      }).join('') +
      '<h2>Restaurer une sauvegarde</h2>' +
      '<div class="card stack"><p class="sub">Importez une archive <b>carnet-patrons.zip</b> ou un fichier <b>patterns.jsonl</b> pour restaurer vos patrons et photos sur cet appareil.</p>' +
      '<label class="btn" for="restoreIn">Importer une sauvegarde (.zip / .jsonl)</label>' +

  function viewGuide() {
    var n = ALLF.length;
    return '<div class="top"><h1>Champs de la fiche</h1></div><p class="sub" style="margin-bottom:12px">' + n + ' champs et 2 tableaux par taille. Un point bleu marque les champs essentiels.</p><div class="stack guide">' +
      SCHEMA.map(function(s) {
        return '<div class="card"><h3>' + esc(s.t) + '</h3><p class="sub">' + esc(s.why) + '</p><ul>' + s.f.map(function(f) {
          if (f.k === '@measures') return '<li><b>Tableau des mesures finies</b> : ' + MEASURES.map(function(m) { return esc(m[1]); }).join(', ') + ' pour chaque taille.</li>';
          if (f.k === '@counts') return '<li><b>Tableau des mailles et rangs</b> : ' + COUNTS.map(function(m) { return esc(m[1]); }).join(', ') + ' pour chaque taille.</li>';
          return '<li>' + (f.core ? '<span class="core"></span> ' : '') + esc(f.l) + (f.u ? ' (' + esc(f.u) + ')' : '') + (f.o ? ' <span class="sub">: ' + esc(f.o.join(', ')) + '</span>' : '') + '</li>';
        }).join('') + '</ul></div>';
      }).join('') + '</div>';

  function render() {
    var a = document.activeElement, keepId = a && a.id && /^(q|title|rawText|pasteText|pasteTitle|newFolder|renameIn|apiKeyIn)$/.test(a.id) ? a.id : null;
    var h = '';
    if (S.tab === 'lib') h = viewLib();
    else if (S.tab === 'add') h = viewAdd();
    else if (S.tab === 'det') h = viewDet();
    else if (S.tab === 'exp') h = viewExp();
    else h = viewGuide();

    if (S.busy) {
      h += '<div class="note info" style="position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;max-width:688px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,0.2)">' +
        '<span class="spin"></span><span class="grow">' + esc(S.busy) + '</span><button class="btn small" data-act="cancel">Annuler</button></div>';
    }
    $('#app').innerHTML = h + tabbar();
    if (keepId) {
      var e = document.getElementById(keepId);

    resolveLazyImages();
    if (S.tab === 'lib') queueThumbs();
